# Phase 1: deploy with luaFile.
# Fill in cluster + repositoryRef (or git.url) for your environment.
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: lua-python-cache-demo
  namespace: infra
spec:
  name: lua-python-cache-demo
  namespace: lua-python-cache-demo
  version: "0.0.1"
  cluster: REPLACE_ME_CLUSTER_HANDLE
  # repositoryRef:
  #   name: REPLACE_ME_GIT_REPO
  #   namespace: infra
  git:
    ref: main
    folder: "."
  # If this demo lives inside the console monorepo instead of its own remote:
  # git:
  #   ref: main
  #   folder: demo-lua-python-cache
  helm:
    luaFile: values.lua
  syncConfig:
    createNamespace: true
