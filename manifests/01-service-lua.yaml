# Phase 1: deploy with luaFile.
# Fill in cluster + repositoryRef (or git.url) for your environment.
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: lua-python-cache-demo
  namespace: infra
spec:
  name: lua-python-cache-demo
  namespace: lua-python-cache-demo
  version: "0.0.1"
  cluster: lukasz
  repositoryRef:
    kind: GitRepository
    name: lua-python-cache-demo
    namespace: infra
  git:
    ref: main
    folder: "."
  helm:
    luaFile: values.lua
  syncConfig:
    createNamespace: true
